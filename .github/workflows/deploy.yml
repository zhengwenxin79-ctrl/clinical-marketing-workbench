name: Deploy Clinical Marketing Workbench to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每周一早上 08:30 (北京时间 UTC+8 => UTC 00:30) 自动执行周度会议批次入库与工作台构建
    - cron: '30 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Auto-ingest Crawled Batches from WorkBuddy
        run: |
          python -X utf8 tools/auto_ingest_batches.py

      - name: Verify Baseline & Regressions
        run: |
          python -X utf8 tools/test_regression.py
          python -X utf8 tools/test_conference_updates.py

      - name: Package & Export Static Workbench
        run: |
          python -X utf8 tools/export_pages.py

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
