<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>销售代表工作台 · 吉因加临床科研营销</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      background-color: #f8fafc;
      font-size: 15px;
      line-height: 1.6;
    }
    [x-cloak] { display: none !important; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen bg-slate-50 selection:bg-blue-600 selection:text-white"
      x-data="salesPortalApp()">

  <!-- Toast Container -->
  <div class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none" x-cloak>
    <template x-for="toast in toasts" :key="toast.id">
      <div class="pointer-events-auto px-5 py-3 rounded-xl shadow-lg text-sm font-bold flex items-center gap-2 transition-all"
           :class="{
             'bg-slate-900 text-white': toast.type === 'success' || toast.type === 'info',
             'bg-amber-600 text-white': toast.type === 'warning',
             'bg-rose-600 text-white': toast.type === 'error'
           }">
        <span x-text="toast.message"></span>
      </div>
    </template>
  </div>

  <!-- ========================================== -->
  <!-- CLEAN SINGLE TOP BAR (All-in-One Nav)      -->
  <!-- ========================================== -->
  <header class="bg-white border-b border-slate-200 px-6 h-16 sticky top-0 z-40 flex items-center justify-between">
    <div class="flex items-center gap-6">
      <!-- Brand -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white font-bold flex items-center justify-center text-base shadow-xs">
          销
        </div>
        <span class="font-bold text-slate-900 text-lg tracking-tight">销售代表工作台</span>
      </div>

      <!-- 3 Clean Primary Tabs -->
      <nav class="flex items-center gap-1.5 bg-slate-100 p-1.5 rounded-xl">
        <button @click="activeTab = 'cards'"
                :class="activeTab === 'cards' ? 'bg-white text-blue-600 shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                class="px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-2">
          <span>🎯 商机作战卡</span>
          <span class="px-2 py-0.2 rounded-full text-xs"
                :class="activeTab === 'cards' ? 'bg-blue-50 text-blue-600 font-bold' : 'bg-slate-200 text-slate-600'"
                x-text="myBattleCards.length"></span>
        </button>

        <button @click="activeTab = 'territory'"
                :class="activeTab === 'territory' ? 'bg-white text-blue-600 shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                class="px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-2">
          <span>📍 本战区 PI 库</span>
          <span class="px-2 py-0.2 rounded-full text-xs"
                :class="activeTab === 'territory' ? 'bg-blue-50 text-blue-600 font-bold' : 'bg-slate-200 text-slate-600'"
                x-text="myTerritoryPIs.length"></span>
        </button>

        <button @click="activeTab = 'feedback'"
                :class="activeTab === 'feedback' ? 'bg-white text-blue-600 shadow-xs font-bold' : 'text-slate-600 hover:text-slate-900 font-medium'"
                class="px-4 py-1.5 rounded-lg text-sm transition-all flex items-center gap-2">
          <span>📝 拜访日报</span>
          <span class="px-2 py-0.2 rounded-full text-xs"
                :class="activeTab === 'feedback' ? 'bg-blue-50 text-blue-600 font-bold' : 'bg-slate-200 text-slate-600'"
                x-text="myFeedbacks.length"></span>
        </button>
      </nav>
    </div>

    <!-- Right Controls: Rep Switcher + Back to Market -->
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-slate-100 px-3.5 py-1.5 rounded-xl text-sm">
        <span class="text-slate-400">👤</span>
        <select x-model="currentRepId" @change="onRepChange()" class="bg-transparent font-bold text-slate-800 focus:outline-none cursor-pointer">
          <template x-for="rep in reps" :key="rep.id">
            <option :value="rep.id" x-text="rep.label"></option>
          </template>
        </select>
      </div>

      <a href="index.html"
         class="px-3.5 py-1.5 bg-slate-900 hover:bg-blue-600 text-white rounded-xl text-sm font-semibold transition-all">
        🏢 市场主台 &nearr;
      </a>
    </div>
  </header>

  <!-- ========================================== -->
  <!-- MAIN WORKSPACE (Spacious, Low Visual Noise)-->
  <!-- ========================================== -->
  <main class="max-w-7xl w-full mx-auto px-6 py-6">

    <!-- ========================================================== -->
    <!-- TAB 1: 🎯 商机作战卡 (Minimalist Left List + Right Detail)   -->
    <!-- ========================================================== -->
    <div x-show="activeTab === 'cards'" class="space-y-5">

      <!-- Compact 1-Line Collapsible Conference Reminder Bar -->
      <div class="bg-white rounded-2xl border border-slate-200 px-5 py-3.5 shadow-2xs">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div class="flex items-center gap-3 flex-wrap text-sm">
            <span class="px-2.5 py-0.5 bg-blue-50 text-blue-700 rounded-md font-bold text-xs">📢 本周重点参会</span>
            <template x-for="cp in myConferencePushes" :key="cp.id">
              <span class="font-semibold text-slate-800 flex items-center gap-1.5">
                <span x-text="cp.shortName"></span>
                <span class="text-xs text-slate-400" x-text="'(' + cp.city + ' · ' + cp.date + ')'"></span>
              </span>
            </template>
          </div>
          <button @click="showConfPush = !showConfPush"
                  class="text-sm text-blue-600 hover:text-blue-800 font-bold">
            <span x-text="showConfPush ? '收起会议指引 ↑' : '查看参会 PI 与认领 (' + myConferencePushes.length + '场) ↓'"></span>
          </button>
        </div>

        <!-- Expanded Conference Cards (Hidden by default so screen stays clean!) -->
        <div x-show="showConfPush" x-transition class="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 mt-3.5 border-t border-slate-100">
          <template x-for="cp in myConferencePushes" :key="cp.id">
            <div class="bg-slate-50 rounded-xl p-4 border border-slate-200/80 flex items-center justify-between gap-4">
              <div class="space-y-1">
                <div class="font-bold text-slate-900 text-base" x-text="cp.title"></div>
                <div class="text-xs text-slate-500" x-text="'📅 ' + cp.date + ' · 📍 ' + cp.city + ' · 必见PI：' + cp.speakers.join('、')"></div>
              </div>
              <button @click="claimConference(cp)"
                      :disabled="cp.claimed"
                      :class="cp.claimed ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-600 hover:bg-blue-700 text-white'"
                      class="px-3.5 py-2 rounded-xl text-xs font-bold shrink-0 transition-all">
                <span x-text="cp.claimed ? '✓ 已认领' : '📌 认领参会'"></span>
              </button>
            </div>
          </template>
        </div>
      </div>

      <!-- Main Split Layout: Left Customer List (3 cols) + Right Clean Battle Card (9 cols) -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

        <!-- Left Column: Ultra-Clean Customer List (Name + Score + Hospital + Short Topic) -->
        <div class="lg:col-span-4 space-y-3">
          <div class="flex items-center justify-between px-1">
            <span class="text-sm font-bold text-slate-500">待跟进专家列表</span>
            <select x-model="cardStatusFilter" class="bg-transparent text-sm font-semibold text-slate-600 focus:outline-none cursor-pointer">
              <option value="all">全部状态</option>
              <option value="assigned">待接触</option>
              <option value="in_progress">跟进中</option>
              <option value="contacted">已触达</option>
            </select>
          </div>

          <div class="space-y-2.5">
            <template x-for="card in myBattleCards" :key="card.id">
              <div @click="selectedCardId = card.id"
                   :class="selectedCard && selectedCard.id === card.id ? 'border-blue-600 bg-white shadow-md ring-2 ring-blue-500/15' : 'border-slate-200/90 bg-white hover:border-slate-300'"
                   class="p-4 rounded-2xl border cursor-pointer transition-all">
                <!-- Row 1: Big PI Name + Score Badge + Status Dot -->
                <div class="flex items-center justify-between gap-2 mb-1.5">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-slate-900 text-lg" x-text="card.piName"></span>
                    <span class="px-2 py-0.5 rounded-md text-xs font-bold bg-slate-100 text-slate-700" x-text="card.scoreBadge"></span>
                  </div>
                  <span class="px-2.5 py-0.5 rounded-full text-xs font-bold"
                        :class="{
                          'bg-amber-50 text-amber-700': card.status === 'assigned',
                          'bg-blue-50 text-blue-700': card.status === 'in_progress',
                          'bg-emerald-50 text-emerald-700': card.status === 'contacted'
                        }"
                        x-text="getStatusLabel(card.status)"></span>
                </div>

                <!-- Row 2: Hospital -->
                <div class="text-sm text-slate-600 font-medium truncate" x-text="card.hospital"></div>

                <!-- Row 3: Short Topic Tag -->
                <div class="mt-2.5 flex items-center justify-between text-xs text-slate-400">
                  <span class="px-2 py-0.5 bg-slate-50 text-slate-600 rounded border border-slate-200/70 font-medium truncate max-w-[200px]"
                        x-text="card.shortTopic"></span>
                  <span x-text="card.dueDate + ' 截止'"></span>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- Right Column: Clean, Spacious Battle Card Detail (No Harsh Rainbow Boxes!) -->
        <div class="lg:col-span-8">
          <template x-if="selectedCard">
            <div class="bg-white rounded-3xl border border-slate-200/90 shadow-xs p-7 md:p-8 space-y-7">

              <!-- 1. Clean Header: PI Profile + Primary Action Button -->
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-slate-100">
                <div class="flex items-center gap-4">
                  <div class="w-14 h-14 rounded-2xl bg-blue-600 text-white font-bold flex items-center justify-center text-2xl shrink-0 shadow-sm"
                       x-text="selectedCard.piName.substring(0, 1)"></div>
                  <div>
                    <div class="flex items-center gap-2.5 flex-wrap">
                      <h2 class="text-2xl font-bold text-slate-900" x-text="selectedCard.piName"></h2>
                      <span class="px-3 py-0.5 rounded-full text-xs font-bold text-white"
                            :style="'background-color:' + getDomainColor(selectedCard.domain)"
                            x-text="selectedCard.domain"></span>
                      <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200"
                            x-text="'四维评分 ' + selectedCard.scoreBadge"></span>
                    </div>
                    <p class="text-base text-slate-600 font-medium mt-1" x-text="selectedCard.hospital + ' · ' + selectedCard.roleLabel"></p>
                  </div>
                </div>

                <button @click="openFeedbackModal(selectedCard)"
                        class="px-5 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl text-sm font-bold shadow-sm transition-all shrink-0 self-start sm:self-center">
                  📝 填写拜访反馈
                </button>
              </div>

              <!-- 00. 现场会议蹲点锦囊 (精准破冰窗口) -->
              <template x-if="selectedCard && selectedCard.squatInfo">
                <div class="bg-gradient-to-r from-amber-50 to-orange-50/70 border border-amber-200/90 rounded-2xl p-4.5 space-y-2.5 shadow-2xs">
                  <div class="flex items-center justify-between">
                    <span class="text-sm font-bold text-amber-900 flex items-center gap-1.5">
                      <span class="text-base">📍</span> 现场会议蹲点锦囊 (精准破冰窗口)
                    </span>
                    <span class="px-2.5 py-0.5 rounded-lg text-xs font-bold bg-amber-200/80 text-amber-900" x-text="selectedCard.squatInfo.conference"></span>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5 text-xs">
                    <div class="bg-white/80 p-2.5 rounded-xl border border-amber-200/60">
                      <span class="text-amber-700/80 block mb-0.5">参会会场 / 讲台</span>
                      <span class="font-bold text-slate-900" x-text="selectedCard.squatInfo.venue"></span>
                    </div>
                    <div class="bg-white/80 p-2.5 rounded-xl border border-amber-200/60 sm:col-span-2">
                      <span class="text-amber-700/80 block mb-0.5">现场讲题 / 报告焦点</span>
                      <span class="font-bold text-slate-900 truncate block" x-text="selectedCard.squatInfo.topic"></span>
                    </div>
                  </div>
                  <div class="text-xs text-amber-800 bg-amber-100/60 p-2.5 rounded-xl font-medium flex items-start gap-1.5">
                    <span>💡</span>
                    <span x-text="selectedCard.squatInfo.actionAdvice"></span>
                  </div>
                </div>
              </template>

              <!-- 2. Core Focus: 破冰话术 (Clean Soft Card, Large Readable Text) -->
              <div class="space-y-2.5">
                <div class="flex items-center justify-between">
                  <span class="text-sm font-bold text-slate-500 uppercase tracking-wider">💬 01 · 推荐微信 / 面访破冰话术</span>
                  <button @click="copyIceBreaker(selectedCard.breakIceScript)"
                          class="px-3.5 py-1.5 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">
                    📋 一键复制话术
                  </button>
                </div>
                <div class="bg-slate-50 border border-slate-200/90 rounded-2xl p-5 text-slate-800 text-base leading-relaxed font-medium"
                     x-text="selectedCard.breakIceScript"></div>
              </div>

              <!-- 3. Two-Column Key Points: 为什么找他 & 进院必问 3 件事 (Short Bullet Tags!) -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                <!-- Left Box: 切入契机与痛点 -->
                <div class="bg-slate-50/70 rounded-2xl p-5 border border-slate-200/70 space-y-3">
                  <div class="text-sm font-bold text-slate-500">💡 02 · 切入契机与专家痛点</div>
                  <div class="text-base font-bold text-slate-900" x-text="selectedCard.shortTopic"></div>
                  <p class="text-sm text-slate-600 leading-relaxed" x-text="selectedCard.painPoint"></p>
                  <div class="pt-1 flex flex-wrap gap-2">
                    <template x-for="cap in selectedCard.capabilities" :key="cap">
                      <span class="px-3 py-1 bg-blue-50 text-blue-700 border border-blue-200/80 rounded-lg text-xs font-bold" x-text="'匹配武器: ' + cap"></span>
                    </template>
                  </div>
                </div>

                <!-- Right Box: 首次进院必摸清 3 件事 (Checklist instead of paragraph!) -->
                <div class="bg-slate-50/70 rounded-2xl p-5 border border-slate-200/70 space-y-3">
                  <div class="text-sm font-bold text-slate-500">📋 03 · 本次拜访必摸清 3 件事</div>
                  <ul class="space-y-2.5 text-sm text-slate-700 font-medium">
                    <template x-for="(chk, idx) in selectedCard.checklist" :key="idx">
                      <li class="flex items-start gap-2.5 bg-white px-3.5 py-2.5 rounded-xl border border-slate-200/60">
                        <span class="w-5 h-5 rounded-full bg-blue-50 text-blue-600 font-bold text-xs flex items-center justify-center shrink-0 mt-0.5" x-text="idx + 1"></span>
                        <span x-text="chk"></span>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>

              <!-- 4. Minimalist 4D Score Strip & Conference Talk Evidence -->
              <div class="pt-2 border-t border-slate-100 space-y-4">
                <div class="flex flex-wrap items-center justify-between gap-2">
                  <span class="text-sm font-bold text-slate-500">📊 04 · 专家四维合作评分 &amp; 近期讲题证据</span>
                  <span class="text-xs text-slate-400" x-text="'🎤 ' + selectedCard.talkEvidence"></span>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  <template x-for="dim in selectedCard.dimensions" :key="dim.name">
                    <div class="bg-slate-50 px-4 py-3 rounded-xl border border-slate-200/70 flex items-center justify-between">
                      <span class="text-xs text-slate-500 font-medium" x-text="dim.name.slice(0, 4)"></span>
                      <span class="text-sm font-extrabold"
                            :class="dim.score !== null ? 'text-slate-900' : 'text-amber-600'"
                            x-text="dim.score !== null ? (dim.score + '/' + dim.maximum) : '待摸底'"></span>
                    </div>
                  </template>
                </div>
              </div>

              <!-- 5. Lightweight Footer: One-Click Card Quality Rating -->
              <div class="pt-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3 text-sm">
                <span class="text-slate-400">这张推荐卡对您拜访有帮助吗？</span>
                <div class="flex items-center gap-2">
                  <button @click="rateBattleCard(selectedCard, '👍 很有用')"
                          :class="selectedCard.qualityRating?.includes('很有用') ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                          class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all">
                    👍 很有用
                  </button>
                  <button @click="rateBattleCard(selectedCard, '🤔 暂不确定')"
                          :class="selectedCard.qualityRating?.includes('暂不确定') ? 'bg-amber-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                          class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all">
                    🤔 暂不确定
                  </button>
                  <button @click="rateBattleCard(selectedCard, '👎 不适用')"
                          :class="selectedCard.qualityRating?.includes('不适用') ? 'bg-rose-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'"
                          class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition-all">
                    👎 不适用
                  </button>
                </div>
              </div>

            </div>
          </template>
        </div>

      </div>
    </div>


    <!-- ========================================================== -->
    <!-- TAB 2: 📍 本战区 PI 库 (Clean 2-Col Territory Cards)        -->
    <!-- ========================================================== -->
    <div x-show="activeTab === 'territory'" class="space-y-5">
      <div class="bg-white rounded-2xl border border-slate-200 px-6 py-4 shadow-2xs flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <button @click="territoryFilter = 'all'"
                  :class="territoryFilter === 'all' ? 'bg-slate-900 text-white font-bold' : 'bg-slate-100 text-slate-700 font-medium'"
                  class="px-4 py-2 rounded-xl text-sm transition-all">
            本战区全部专家 (<span x-text="myTerritoryPIs.length"></span>)
          </button>
          <button @click="territoryFilter = 'fav'"
                  :class="territoryFilter === 'fav' ? 'bg-amber-500 text-white font-bold' : 'bg-slate-100 text-slate-700 font-medium'"
                  class="px-4 py-2 rounded-xl text-sm transition-all">
            ★ 重点收藏 (<span x-text="myTerritoryPIs.filter(p => p.starred).length"></span>)
          </button>
        </div>

        <div class="relative w-64">
          <input type="text"
                 x-model="searchQuery"
                 placeholder="搜索姓名或医院..."
                 class="w-full pl-9 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-xl text-sm focus:outline-none focus:bg-white focus:ring-2 focus:ring-blue-500">
          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <template x-for="pi in filteredTerritoryPIs" :key="pi.id">
          <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-2xs hover:shadow-md hover:border-blue-300 transition-all flex flex-col justify-between gap-5">
            <div>
              <div class="flex items-start justify-between gap-2 mb-3">
                <div>
                  <div class="flex items-center gap-2">
                    <h4 class="font-bold text-slate-900 text-xl" x-text="pi.name"></h4>
                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold text-white"
                          :style="'background-color:' + getDomainColor(pi.domain)"
                          x-text="pi.domain"></span>
                  </div>
                  <p class="text-sm text-slate-500 font-medium mt-1" x-text="pi.hospital"></p>
                </div>
                <span class="px-2.5 py-1 rounded-lg text-xs font-bold bg-slate-100 text-slate-700 shrink-0"
                      x-text="pi.scoreBadge"></span>
              </div>

              <p class="text-sm text-slate-600 line-clamp-2 bg-slate-50 p-3 rounded-xl border border-slate-100"
                 x-text="pi.research"></p>
            </div>

            <div class="flex items-center justify-between gap-2 pt-3 border-t border-slate-100">
              <button @click="pi.starred = !pi.starred"
                      :class="pi.starred ? 'text-amber-600 bg-amber-50 border-amber-200 font-bold' : 'text-slate-400 bg-slate-50 border-slate-200'"
                      class="px-3 py-2 rounded-xl border text-xs transition-all">
                <span x-text="pi.starred ? '★ 已收藏' : '☆ 收藏'"></span>
              </button>
              <button @click="generateBattleCardFromPI(pi)"
                      class="flex-1 py-2 px-3 bg-blue-50 hover:bg-blue-600 text-blue-600 hover:text-white rounded-xl text-xs font-bold transition-all">
                🎯 生成作战卡 &rarr;
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>


    <!-- ========================================================== -->
    <!-- TAB 3: 📝 拜访日报 (Clean Timeline Cards)                   -->
    <!-- ========================================================== -->
    <div x-show="activeTab === 'feedback'" class="space-y-5">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-900 text-lg">我的拜访记录（已实时同步市场部）</h3>
        <button @click="openFeedbackModal(selectedCard || myBattleCards[0])"
                class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-bold shadow-xs transition-all">
          + 新增拜访日报
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

          speakers: ['陈荣昌 (广医一院)', '罗红 (湘雅二院)'],
          claimed: true
        },
        {
          id: 'CP-ZSNEURO2026', repId: 'sales_south_wang',
          shortName: '中山神经病学论坛',
          title: '第二十九届中山神经病学学术论坛·2026',
          date: '11-27~11-29', city: '广州',
          speakers: ['陆正齐 (中山三院)'],
          claimed: false
        }
      ];

      function buildTerritoryPool() {
        const pool = [];
        const added = new Set();
        const reportMap = new Map((D.reports || []).map(r => [r.report_id, r]));

        for (const bc of DEFAULT_BATTLE_CARDS) {
          pool.push({
            id: bc.id,
            name: bc.piName,
            hospital: bc.hospital,
            domain: bc.domain,
            roleLabel: bc.roleLabel,
            scoreBadge: bc.scoreBadge,
            research: bc.talkEvidence,
            repId: bc.repId,
            starred: true
          });
          added.add(bc.piName);
        }

        for (const r of ((D.pi_ratings && D.pi_ratings.ratings) || [])) {
          if (added.has(r.name)) continue;
          const inst = r.institution_source || '国内重点三甲医院';
          let repId = 'sales_east_zhang';
          if (REPS[1].kw.test(inst)) repId = 'sales_north_li';
          else if (REPS[2].kw.test(inst)) repId = 'sales_south_wang';

          pool.push({
            id: r.person_key,
            name: r.name,
            hospital: inst,
            domain: '糖尿病与代谢',
            roleLabel: '临床科研专家',
            scoreBadge: Number.isFinite(r.total_score) ? `${r.total_score}分 · ${r.grade}级` : '调研中',
            research: (r.dimensions && r.dimensions[0] && r.dimensions[0].basis) || '糖尿病与代谢临床转化队列研究',
            repId,
            starred: Number.isFinite(r.total_score)
          });
          added.add(r.name);
        }

        for (const exp of (D.experts || []).filter(e => e.tier_code && e.tier_code !== 'undetermined').slice(0, 45)) {
          if (added.has(exp.display_name)) continue;
          const inst = (exp.institution_source && exp.institution_source !== '单位见原始论文及身份依据')
            ? exp.institution_source
            : (exp.role_basis ? exp.role_basis.split(/[；，,]/)[0] : '国内重点三甲医院');
          let repId = 'sales_east_zhang';
          if (REPS[1].kw.test(inst)) repId = 'sales_north_li';
          else if (REPS[2].kw.test(inst)) repId = 'sales_south_wang';

          const firstTalk = (exp.report_ids || []).map(id => reportMap.get(id)).find(Boolean);
          pool.push({
            id: exp.key,
            name: exp.display_name,
            hospital: inst,
            domain: '糖尿病与代谢',
            roleLabel: exp.tier_label || '全国学术带头人',
            scoreBadge: exp.tier_code === 'international' ? '国际学者' : '全国带头人',
            research: firstTalk ? `${firstTalk.conference_id}：${firstTalk.title}` : (exp.role_basis || '内分泌与代谢临床转化研究'),
            repId,
            starred: false
          });
          added.add(exp.display_name);
        }

        return pool;
      }

      // Merge stored battle cards with clean fields
      const rawStoredCards = readStore('clinical-workbench:battle-cards:v2', null);
      const initialCards = Array.isArray(rawStoredCards) && rawStoredCards.length
        ? rawStoredCards.map(c => {
            const def = DEFAULT_BATTLE_CARDS.find(d => d.id === c.id || d.piName === c.piName);
            return {
              ...(def || {}),
              ...c,
              shortTopic: c.shortTopic || (def && def.shortTopic) || (c.domain + '多组学课题'),
              checklist: c.checklist || (def && def.checklist) || [
                '摸清科室现有队列样本类型与冻存例数',
                '确认随访终点与近期检测需求',
                '了解2027国自然或专项申报时间表'
              ]
            };
          })
        : DEFAULT_BATTLE_CARDS;

      const defaultFeedbacks = [
        {
          id: 'vr1',
          repId: 'sales_east_zhang',
          repName: '张敏 (华东战区)',
          date: '2026-11-23',
          piName: '王卫庆',
          hospital: '上海瑞金医院',
          contactStatusLabel: '已接触面访',
          ongoingProject: '国家重点研发计划「四大慢病」代谢病精准分型专项在研 + 国家自然重点项目在研',
          cohort: '围绕 CDS 2026 大会报告沟通了瑞金代谢队列需求，拟挑 300 例微血管并发症进展亚组开展血浆蛋白组与转录组验证(T10/T14)。',
          content: '围绕 CDS 2026 大会报告沟通了瑞金代谢队列需求，拟挑 300 例微血管并发症进展亚组开展血浆蛋白组与转录组验证(T10/T14)。',
          nextStep: '下周二前提交《代谢队列多组学联合验证方案》'
        },
        {
          id: 'vr2',
          repId: 'sales_east_zhang',
          repName: '张敏 (华东战区)',
          date: '2026-11-22',
          piName: '黄斌',
          hospital: '安徽省立医院',
          contactStatusLabel: '已接触面访',
          ongoingProject: '安徽省自然科学基金青年项目《DKD早期损伤标志物筛选与外泌体转录组验证》在研（准备冲刺2027国自然面上）',
          cohort: '已冻存 320 例具备完整随访的 DKD 早期患者配对尿液与血浆标本，拟 Q4 启动转录组验证。',
          content: '已冻存 320 例具备完整随访的 DKD 早期患者配对尿液与血浆标本，拟 Q4 启动转录组验证。',
          nextStep: '寄送尿液外泌体建库质控 SOP'
        },
        {
          id: 'vr3',
          repId: 'sales_north_li',
          repName: '李娜 (华北战区)',
          date: '2026-11-23',
          piName: '吉训明',
          hospital: '首都医科大学宣武医院',
          contactStatusLabel: '已接触面访',
          ongoingProject: '科技创新2030「脑科学与类脑研究」重大项目在研 + 国家百万减残工程急性卒中多中心临床队列',
          cohort: '在 2026 脑卒中大会筹备期对接了课题秘书，首期拟挑选 200 例急性卒中再灌注损伤配对血浆/脑脊液做超敏蛋白组与外泌体转录组联检。',
          content: '在 2026 脑卒中大会筹备期对接了课题秘书，首期拟挑选 200 例急性卒中再灌注损伤配对血浆/脑脊液做超敏蛋白组与外泌体转录组联检。',
          nextStep: '11-27 脑卒中大会现场与分管子课题负责人敲定建库质控标准'
        },
        {
          id: 'vr4',
          repId: 'sales_south_wang',
          repName: '王强 (华南战区)',
          date: '2026-11-23',
          piName: '陈荣昌',
          hospital: '广州医科大学附属第一医院',
          contactStatusLabel: '已接触面访',
          ongoingProject: '国家自然科学基金面上项目《慢阻肺早期气道微生态-宿主互作分子分型》在研 + 钟南山院士团队呼吸健康大队列子课题',
          cohort: '已收集 180 例慢阻肺早期进展患者配对诱导痰与外周血样本，认可吉因加同一份痰液样本同时做宏基因组+宿主转录组的双组学方案。',
          content: '已收集 180 例慢阻肺早期进展患者配对诱导痰与外周血样本，认可吉因加同一份痰液样本同时做宏基因组+宿主转录组的双组学方案。',
          nextStep: '长沙 CACP 呼吸年会会后安排生信总监到广医一院做专题技术交流'
        }
      ];

      const storedFeedbacksRaw = readStore('clinical-workbench:visit-reports:v2', null);
      const initialFeedbacks = Array.isArray(storedFeedbacksRaw) && storedFeedbacksRaw.length
        ? storedFeedbacksRaw.map(fb => {
            const def = defaultFeedbacks.find(d => d.id === fb.id || d.piName === fb.piName);
            return {
              ...(def || {}),
              ...fb,
              ongoingProject: fb.ongoingProject || (def && def.ongoingProject) || '国家/省部级临床转化课题在研（国自然/省自然在研课题）'
            };
          })
        : defaultFeedbacks;

      return {
        reps: REPS,
        currentRepId: 'sales_east_zhang',
        activeTab: 'cards',
        showConfPush: false,
        cardStatusFilter: 'all',
        territoryFilter: 'all',
        searchQuery: '',

        battleCards: initialCards,
        conferencePushes: CONFERENCE_PUSHES,
        territoryPIs: buildTerritoryPool(),
        feedbacks: initialFeedbacks,

        selectedCardId: initialCards[0]?.id || '',

        toasts: [],
        showToast(message, type = 'success') {
          const id = Date.now() + Math.random();
          this.toasts.push({ id, message, type });
          setTimeout(() => {
            this.toasts = this.toasts.filter(t => t.id !== id);
          }, 3000);
        },

        get currentRep() {
          return this.reps.find(r => r.id === this.currentRepId) || this.reps[0];
        },

        onRepChange() {
          const first = this.myBattleCards[0];
          if (first) this.selectedCardId = first.id;
          this.showToast(`已切换至：${this.currentRep.label}`, 'info');
        },

        getDomainColor(domainName) {
          return DOMAINS[domainName] || '#2563eb';
        },

        getStatusLabel(st) {
          const map = { assigned: '待接触', in_progress: '跟进中', contacted: '已触达' };
          return map[st] || '跟进中';
        },

        get myConferencePushes() {
          return this.conferencePushes.filter(c => c.repId === this.currentRepId);
        },

        get myBattleCards() {
          return this.battleCards.filter(c => {
            const matchRep = !c.repId || c.repId === this.currentRepId || (c.assignee && c.assignee.includes(this.currentRep.name));
            const matchStatus = this.cardStatusFilter === 'all' || c.status === this.cardStatusFilter;
            return matchRep && matchStatus;
          });
        },

        get selectedCard() {
          return this.myBattleCards.find(c => c.id === this.selectedCardId) || this.myBattleCards[0] || null;
        },

        get myTerritoryPIs() {
          return this.territoryPIs.filter(p => p.repId === this.currentRepId);
        },

        get filteredTerritoryPIs() {
          const q = this.searchQuery.trim().toLowerCase();
          return this.myTerritoryPIs.filter(p => {
            const matchFav = this.territoryFilter === 'all' || (this.territoryFilter === 'fav' && p.starred);
            const matchSearch = !q || [p.name, p.hospital, p.research, p.domain].join(' ').toLowerCase().includes(q);
            return matchFav && matchSearch;
          });
        },

        get myFeedbacks() {
          return this.feedbacks.filter(f => !f.repId || f.repId === this.currentRepId || (f.repName && f.repName.includes(this.currentRep.name)));
        },

        claimConference(cp) {
          cp.claimed = true;
          this.showToast(`✓ 已认领【${cp.shortName}】参会跟进`, 'success');
        },

        copyIceBreaker(text) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
              this.showToast('✓ 破冰话术已复制，可直接粘贴发送！', 'success');
            }).catch(() => {
              this.showToast('✓ 破冰话术已复制！', 'success');
            });
          } else {
            this.showToast('✓ 破冰话术已复制！', 'success');
          }
        },

        rateBattleCard(card, ratingText) {
          card.qualityRating = ratingText;
          writeStore('clinical-workbench:battle-cards:v2', this.battleCards);
          this.showToast(`已反馈评价：${ratingText}`, 'info');
        },

        generateBattleCardFromPI(pi) {
          const existing = this.battleCards.find(c => c.piName === pi.name && c.repId === this.currentRepId);
          if (existing) {
            this.selectedCardId = existing.id;
            this.activeTab = 'cards';
            this.showToast(`已打开【${pi.name}】作战卡`, 'info');
            return;
          }
          const newCard = {
            id: 'BC-GEN-' + Date.now(),
            repId: this.currentRepId,
            piName: pi.name,
            hospital: pi.hospital,
            domain: pi.domain,
            roleLabel: pi.roleLabel,
            scoreBadge: pi.scoreBadge,
            status: 'assigned',
            dueDate: '12-05',
            shortTopic: `${pi.domain}多组学队列转化`,
            breakIceScript: `“${pi.name}主任您好，非常关注您在【${pi.research}】方向的研究！吉因加近期结合 6Dmarker 多组学算法（T10）与高通量蛋白组/转录组技术，协助多家三甲医院产出了高分转化成果，想约您 15 分钟汇报下案例！”`,
            painPoint: '临床转化队列受限于常规生化指标维度单一，需要高通量多组学数据与生信建模支撑高分论文产出。',
            capabilities: ['T10 队列多组学验证', 'T03 单细胞/转录组'],
            checklist: [
              '摸清科室现有随访队列样本类型与冻存例数',
              '确认近期是否有样本初筛与生信建模需求',
              '了解2027年国自然或省部级课题申报规划'
            ],
            dimensions: [
              { name: '研究方向契合度', maximum: 30, score: 28 },
              { name: '学术产出质量',   maximum: 25, score: null },
              { name: '科研转化潜力',   maximum: 25, score: null },
              { name: '平台资源禀赋',   maximum: 20, score: null }
            ],
            talkEvidence: pi.research,
            qualityRating: ''
          };
          this.battleCards.unshift(newCard);
          writeStore('clinical-workbench:battle-cards:v2', this.battleCards);
          this.selectedCardId = newCard.id;
          this.activeTab = 'cards';
          this.showToast(`✓ 已生成【${pi.name}】专属作战卡`, 'success');
        },

        showFeedbackModal: false,
        fbForm: {
          cardId: '',
          piName: '',
          hospital: '',
          contactStatusLabel: '已接触面访',
          ongoingProject: '',
          cohort: '',
          nextStep: ''
        },

        openFeedbackModal(card) {
          this.fbForm = {
            cardId: card ? card.id : '',
            piName: card ? card.piName : '王卫庆',
            hospital: card ? card.hospital : '重点合作三甲医院',
            contactStatusLabel: '已接触面访',
            ongoingProject: '',
            cohort: '',
            nextStep: ''
          };
          this.showFeedbackModal = true;
        },

        fillDemoFeedback() {
          const name = this.fbForm.piName || '专家';
          this.fbForm.contactStatusLabel = '已接触面访';
          this.fbForm.ongoingProject = `国家自然科学基金面上项目 / 省级临床医学研究中心重点专项（${name}课题组在研，经费充足）`;
          this.fbForm.cohort = `一线核实：${name}教授团队已冻存 260 例具备完整随访终点的配对血浆与体液样本，对 T10 多组学队列验证很感兴趣，拟下月启动初筛。`;
          this.fbForm.nextStep = `下周三携医学部同事二次进院提交 200 例蛋白组+转录组报价方案`;
        },

        submitFeedback() {
          if (!this.fbForm.cohort && !this.fbForm.ongoingProject) {
            this.showToast('请填写在研项目或样本队列底数', 'error');
            return;
          }
          const today = new Date().toISOString().slice(0, 10);
          const ongoing = this.fbForm.ongoingProject || '国家/省部级临床转化课题在研';
          const cohortText = this.fbForm.cohort || '已完成初步接触，正在核实具体样本队列例数';
          const newFb = {
            id: 'vr_' + Date.now(),
            repId: this.currentRepId,
            repName: `${this.currentRep.name} (${this.currentRep.region})`,
            date: today,
            piName: this.fbForm.piName,
            hospital: this.fbForm.hospital,
            contactStatusLabel: this.fbForm.contactStatusLabel,
            ongoingProject: ongoing,
            cohort: cohortText,
            content: `【在研项目】${ongoing}；【样本队列】${cohortText}`,
            nextStep: this.fbForm.nextStep || '协同医学技术支持持续跟进'
          };

          this.feedbacks.unshift(newFb);
          writeStore('clinical-workbench:visit-reports:v2', this.feedbacks);

          const intelList = readStore('clinical-workbench:intel-list:v2', []);
          intelList.unshift({
            id: 'intel_' + Date.now(),
            piName: this.fbForm.piName,
            hospital: this.fbForm.hospital,
            type: '销售拜访摸底 · 在研项目与样本队列核实',
            content: `【在研项目】${ongoing}；【样本队列】${cohortText}`,
            date: today,
            synced: false
          });
          writeStore('clinical-workbench:intel-list:v2', intelList);

          const card = this.battleCards.find(c => c.id === this.fbForm.cardId || c.piName === this.fbForm.piName);
          if (card) {
            card.status = 'contacted';
            writeStore('clinical-workbench:battle-cards:v2', this.battleCards);
          }

          this.showFeedbackModal = false;
          this.showToast('✓ 拜访反馈已保存并同步至市场部主台！', 'success');
        }
      };
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
