ut,select{padding:9px 11px;border:1px solid #bfcee1;border-radius:4px;background:white;color:var(--ink);max-width:100%}.pill{display:inline-block;background:var(--soft);color:var(--blue);font-size:12px;padding:2px 8px;border-radius:4px;margin:2px 5px 2px 0}.pill.pending{background:#f8f0e1;color:var(--amber)}.pill.outline{background:white;border:1px solid var(--line);color:var(--muted)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:white;color:var(--muted);border-radius:4px;padding:6px 10px;font-size:13px}.chip.active{background:var(--soft);border-color:#95b5da;color:var(--blue)}.rank-row{display:grid;grid-template-columns:42px minmax(0,1fr) 145px;gap:16px;border-bottom:1px solid var(--line);padding:22px 0}.rank-row:last-child{border-bottom:0}.rank-num{font-size:23px;line-height:1.4;color:var(--muted);font-weight:700}.rank-num.top{color:var(--blue)}.topic-title{font-size:18px;font-weight:650;line-height:1.5}.score{font-size:24px;font-weight:700;color:var(--blue);line-height:1.3}.score-unit{font-size:12px;color:var(--muted);font-weight:400}.bar{height:7px;background:#e9eff7;border-radius:4px;margin:10px 0}.bar i{display:block;background:#4679b3;height:100%;border-radius:4px}.evidence-line{font-size:14px;margin:8px 0 0}.speaker-link{white-space:normal}.peek{margin:8px 0;color:var(--muted);font-size:13px}.peek b{font-weight:500;color:var(--ink)}.align{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid>*{min-width:0}.leader-card{padding:18px;border:1px solid var(--line);border-radius:5px;background:white}.leader-card h3{font-size:18px;margin-bottom:4px}.leader-card .institution{min-height:42px;font-size:13px;color:var(--muted)}.leader-card .talk{border-top:1px solid var(--line);padding-top:10px;margin-top:10px;font-size:14px}.links{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:12px}.split{display:gri k-row .score-box{grid-column:2;display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center}.score-box .meta{grid-column:1/-1}.rank-num{font-size:20px}.topic-title{font-size:17px}.toolbar>label,.toolbar .search{width:100%;min-width:0}.score{font-size:23px}.leader-card .institution{min-height:0}.chips{gap:5px}.chip{font-size:12px}.btn{padding:8px 12px}.report h3{font-size:15px}.peek{font-size:13px}}
.split>*{min-width:0}.leader-card{overflow-wrap:anywhere}.panel{min-width:0}h1,h2,h3{overflow-wrap:anywhere}</style></head><body><header><small>临床科研热点工作台 · 糖尿病 · 本地试评</small><h1>CDS 2026 会前重点议题榜</h1><p>看会议重点讨论什么，看学术带头人在讲什么，再看排序依据。</p><p style="font-size:13px">日程存档 2026.11.16 · 会议计划 11月18—21日 · AI归类与试行评分</p></header><main><nav class="nav" aria-label="主导航"><button data-view="board">会前议题榜</button><button data-view="experts">专家在讨论什么</button><button data-view="sources">评分与来源</button></nav><div id="view" aria-live="polite"></div></main><footer class="footer">本地试评 · 基于会议日程与官方讲者资料 · 未发布至原有框架汇总</footer>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent),V=document.querySelector('#view'),T=Object.fromEntries(D.topics.map(t=>[t.id,t])),P=Object.fromEntries(D.people.map(p=>[p.id,p])),R=Object.fromEntries(D.reports.map(r=>[r.code,r]));
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ext=(url,text)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)} ↗</a>`;
const norm=x=>String(x).replace(/\s+/g,'').toLowerCase();
const list=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
const state={parent:'all',q:'',mode:'combined',all:false,leadersOnly:false,expertQ:'',expertLevel:'all',expertParent:'all',expertLimit:18};
const score=t=>state.mode==='agenda'?t.agenda_only_score:t.score,rank=t=>state.mode==='agenda'?t.agenda_only_rank:t.rank;
function nameLinks(ids,max=3){return ids.slice(0,max).map(id=>`<a class="speaker-link" href="#expert/${id}">${esc(P[id].name)}</a>`).join('、')}
function byExpert(r){return r.people.map(p=>{const person=D.people.find(q=>q.key===p.name.replace(/\s+/g,'')+'|'+p.institution.replace(/\s+/g,''));return person?`<a href="#expert/${person.id}">${esc(person.name)}</a>`:esc(p.name)}).join('、')}
function report(r){return `<article class="report"><div><span class="pill">${esc(r.code)}</span><span class="pill outline">${esc(r.kind)}</span>${r.scope!=='入榜'?`<span class="pill pending">${esc(r.scope)} · 不计分</span>`:''}</div><h3>${esc(r.title)}</h3><p>${byExpert(r)} · ${r.people.map(p=>esc(p.institution)).join('；')}</p><p class="meta">${esc(r.date)} ${esc(r.time)} · ${esc(r.session)} · ${esc(r.room)}</p>${r.topic_id?`<p class="meta">主议题：<a href="#topic/${r.topic_id}">${esc(T[r.topic_id].name)}</a></p>`:''}<div>${r.cross_tags.map(t=>`<span class="pill outline">${esc(t)}</span>`).join('')}</div><div class="links">${ext(r.source_url,'官方日程对应专题')}<a href="../原始材料/CDS_详细日程_2026-11-16.html#${esc(r.session_id)}" target="_blank">本地日程原始快照 ↗</a></div></article>`}
function speakerCard(p,topic){const talks=p.reports.map(c=>R[c]).filter(r=>!topic||r.topic_id===topic);const examples=talks.filter(r=>r.kind==='大会报告'||r.kind==='专题报告');const shown=(examples.length?examples:talks).slice(0,2);return `<article class="leader-card"><h3><a href="#expert/${p.id}">${esc(p.name)} →</a></h3><div class="institution">${esc(p.institution)}</div><span class="pill ${p.leader_weight?'':'pending'}">${esc(p.leader_level||(p.is_plenary?'大会主讲 · 身份资料待补':'主讲人 · 带头角色待核'))}</span><p class="lead-phrase">${p.leader_basis.length?esc(p.leader_basis[0]):p.profile_has_bio?'官方简介已读，尚未提取到本榜带头角色依据。':'暂无足够的官方简介内容，保留本人讲题。'}</p>${shown.map(r=>`<div class="talk"><span class="meta">${esc(r.code)} · ${esc(r.kind)}</span><br>${esc(r.title)}</div>`).join('')}<div class="links"><a href="#expert/${p.id}">全部 ${talks.length} 条报告及依据 →</a>${ext(p.profile_url,'官方讲者资料')}</div></article>`}
function board(){const s=D.meta.scope;V.innerHTML=`<section class="panel"><h2>从完整会议日程，看重点研究方向</h2><p>覆盖${s.all_academic}条学术报告，按研究问题归入${s.parent_count}个主题、${s.topic_count}个具体议题。点击议题，即可查看带头人、具体讲题与计分明细。</p><div class="stats"><div class="stat"><b>${s.ranked_reports} / ${s.all_academic}</b><span>入榜报告 / 已处理报告</span></div><div class="stat"><b>${s.topic_count}</b><span>具体研究议题</span></div><div class="stat"><b>${s.ranked_leaders}</b><span>有带头角色依据的关联讲者</span></div><div class="stat"><b>40 / 30 / 20 / 10</b><span>报告 / 专家 / 专题 / 重点报告</span></div></div><p class="meta">带头角色依据来自官方会议简介，包含历任；尚非外部独立履历认证。${s.all_academic-s.ranked_reports}条培训、科研方法及综合题目单列保留。<a href="#sources">查看范围与评分依据 →</a></p><div class="notice">本榜衡量本届会前相对关注度。题名显示的是计划讨论的问题，研究结果待会后补充；接近的分数宜作为同一关注梯队理解。</div></section><section class="panel"><div class="align"><h2>会前重点议题排序</h2><a href="#experts">先看专家在讲什么 →</a></div><div id="parent-chips" class="chips">${[{id:'all',name:'全部主题'},...D.parents].map(p=>`<button class="chip ${state.parent===p.id?'active':''}" data-parent="${p.id}">${esc(p.name)}${p.id==='all'?'':` · ${p.report_count}`}</button>`).join('')}</div><div class="toolbar"><label class="search">查找议题、专家或报告题名<input id="q" type="search" value="${esc(state.q)}" placeholder="例如：洪天配、肠促胰素、糖尿病肾病"></label><label>排序口径<select id="mode"><option value="combined" ${state.mode==='combined'?'selected':''}>含学术带头人覆盖 · 100分</option><option value="agenda" ${state.mode==='agenda'?'selected':''}>仅日程安排 · 去专家项后换算100分</option></select></label><label class="checkbox"><input id="leaders-only" type="checkbox" ${state.leadersOnly?'checked':''}>仅看有全国/领域引领角色的议题</label></div><div id="ranking"></div><button id="show-all" class="btn read-more"></button></section><section class="panel"><div class="align"><h2>大会主讲：重要但不能只看排名</h2><a href="#experts">查看全部专家动向 →</a></div><p class="meta">以下按原日程顺序展示11场大会报告。综合题目保留原题，不强行归入某一具体议题。</p><details><summary>展开大会主讲人及原始讲题 · 11场</summary>${D.reports.filter(r=>r.kind==='大会报告').map(report).join('')}</details></section>`;
 const update=()=>{let ts=D.topics.filter(t=>(state.parent==='all'||t.parent_id===state.parent)&&(!state.leadersOnly||t.leader_ids.some(id=>P[id].leader_weight===3))&&norm([t.name,t.question,...t.report_codes.map(c=>R[c].title),...t.people_ids.map(id=>P[id].name)].join(' ')).includes(norm(state.q)));ts.sort((a,b)=>score(b)-score(a)||a.id.localeCompare(b.id));const shown=state.all?ts:ts.slice(0,12);document.querySelector('#ranking').innerHTML=`<p class="meta">${ts.length}个匹配议题；${state.all?'全部展示':'先显示前'+shown.length+'个'}。排名与归一化始终使用全部${s.topic_count}个议题，不随筛选改变。</p>`+(shown.length?shown.map(t=>{const first=t.featured_codes.slice(0,2).map(c=>R[c]);return `<article class="rank-row"><div class="rank-num ${rank(t)<=3?'top':''}">${rank(t)}</div><div><a class="topic-title" href="#topic/${t.id}">${esc(t.name)}</a><div class="meta">${esc(t.parent)} · ${t.id}</div><p class="oneline">${esc(t.question)}</p><div class="topic-stat">${t.report_count}条报告 · ${t.leader_count}位带头角色讲者 · ${t.session_count}个专题</div><p class="evidence-line"><span class="label">${t.leader_ids.length?'相关带头人':'本题主讲人'}：</span>${t.leader_ids.length?nameLinks(t.leader_ids):nameLinks(t.people_ids)}${t.leader_ids.length>3?` 等${t.leader_count}位`:''}</p>${first.map(r=>`<p class="peek"><b>${esc(r.code)} · ${r.people.map(p=>esc(p.name)).join('、')}</b>｜${esc(r.title)}</p>`).join('')}<div class="links"><a href="#topic/${t.id}">查看讲题、分项与排序依据 →</a></div></div><div class="score-box"><div class="score">${score(t).toFixed(1)} <span class="score-unit">/ 100</span></div><div class="bar"><i style="width:${score(t)}%"></i></div><div class="meta">${state.mode==='agenda'?'仅日程关注度':'会前关注度'}<br>另一口径第${state.mode==='agenda'?t.rank:t.agenda_only_rank}位</div></div></article>`}).join(''):'<div class="empty">没有匹配的议题，请调整搜索或筛选。</div>');const b=document.querySelector('#show-all');b.hidden=ts.length<=12;b.textContent=state.all?'收起，显示前12个':'查看全部'+ts.length+'个议题';document.querySelectorAll('[data-parent]').forEach(b=>b.classList.toggle('active',b.dataset.parent===state.parent));};
 document.querySelectorAll('[data-parent]').forEach(b=>b.onclick=()=>{state.parent=b.dataset.parent;state.all=false;update()});document.querySelector('#q').oninput=e=>{state.q=e.target.value;update()};document.querySelector('#mode').onchange=e=>{state.mode=e.target.value;update()};document.querySelector('#leaders-only').onchange=e=>{state.leadersOnly=e.target.checked;update()};document.querySelector('#show-all').onclick=()=>{state.all=!state.all;update()};update();}
function topic(id){const t=T[id];if(!t)return missing();const leaders=t.leader_ids.map(id=>P[id]);const keyPeople=t.people_ids.map(id=>P[id]).filter(p=>p.reports.some(c=>t.report_codes.includes(c)&&R[c].kind!=='论文发言'));V.innerHTML=`<div class="back"><a class="btn" href="#board">← 返回议题榜</a></div><section class="panel"><span class="pill">${esc(t.parent)}</span><span class="pill outline">${t.id}</span><h1>${esc(t.name)}</h1><p>${esc(t.question)}</p><div class="stats"><div class="stat"><b>${t.score.toFixed(1)}</b><span>会前关注度 /100 · 第${t.rank}位</span></div><div class="stat"><b>${t.report_count}</b><span>直接归入报告</span></div><div class="stat"><b>${t.leader_count}</b><span>有依据的带头角色讲者</span></div><div class="stat"><b>${t.session_count}</b><span>跨专题覆盖</span></div></div></section><section class="panel"><h2>谁在讨论，讨论什么</h2><p class="meta">按已有学术角色依据展示相关讲者；下方列出每人的本题原始讲题。主持不视为主讲，学术角色不代表已同意合作。</p><div class="grid">${(leaders.length?leaders:keyPeople.length?keyPeople:t.people_ids.map(id=>P[id])).map(p=>speakerCard(p,t.id)).join('')}</div>${t.key_bio_missing_ids.length?`<details><summary>还有${t.key_bio_missing_ids.length}位大会/专题讲者的身份依据待补</summary><p>${nameLinks(t.key_bio_missing_ids,100)}</p><p class="meta">日程讲题仍已计入报告量；不把简介缺失写成没有学术影响。</p></details>`:''}</section><section class="panel"><h2>为什么排在这里</h2><div class="split"><article><div class="score">${t.score.toFixed(1)} <span class="score-unit">/100 · 当前证据版第${t.rank}位</span></div><p>${t.report_count}条报告、${t.leader_count}位有角色依据的讲者、${t.session_count}个专题，构成本题会前关注度。</p><div class="scroll"><table><thead><tr><th>指标</th><th>本题原始量</th><th>全榜最大量</th><th>得分 /权重</th></tr></thead><tbody>${t.components.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.raw}${c.name==='学术带头人覆盖'?'个加权单位':''}</td><td>${c.maximum}</td><td>${c.score.toFixed(2)} /${c.weight}</td></tr>`).join('')}</tbody></table></div><p class="meta">总分按未舍入分项相加后保留1位小数，显示分项相加可能有0.01分舍入差。</p></article><article><div class="soft"><h3>排序是否依赖专家项</h3><p>去掉专家覆盖后，其他三项按70分换算100分：<b>${t.agenda_only_score.toFixed(1)}分，第${t.agenda_only_rank}位</b>。</p><p class="meta">这是判断权重影响的对照口径，不是另一场会议的分数。</p></div><p><b>专家依据覆盖：</b>${t.key_people?t.key_bios_read+'/'+t.key_people+'位本题大会/专题讲者有实质简介':'本题暂以论文发言为主，无大会/专题主讲'}</p><p class="meta">专家项是已找到依据的覆盖下限；更多角色核清后可能调整。官方简介含历任，不把多位同职务者推断为同时在任。</p><details><summary>学术带头人覆盖的逐人贡献</summary>${leaders.length?leaders.map(p=>`<p>${nameLinks([p.id])}：${p.leader_weight}单位 · ${esc(p.leader_basis[0])}</p>`).join(''):'<p>暂无达到本榜角色规则的已存依据；不是没有相关专家。</p>'}</details></article></div></section><section class="panel"><div class="align"><h2>原始议题与来源 · ${t.report_count}条</h2><a href="#sources">查看全会处理范围 →</a></div><details open><summary>大会及专题报告 · ${t.report_codes.filter(c=>R[c].kind!=='论文发言').length}条</summary>${t.report_codes.filter(c=>R[c].kind!=='论文发言').map(c=>report(R[c])).join('')||'<p class="meta">本题没有大会/专题报告，论文发言见下。</p>'}</details><details><summary>论文发言 · ${t.kind_counts['论文发言']||0}条</summary>${t.report_codes.filter(c=>R[c].kind==='论文发言').map(c=>report(R[c])).join('')}</details></section><section class="panel"><h2>会后优先补什么</h2><p>取得报告摘要、海报或演讲结果，确认具体研究设计、发现和独立验证，再判断哪些线索值得持续跟踪。</p><p class="meta">目前读取层次：日程题名＋讲者角色。研究结果、临床成熟度及跨年变化仍待补。</p><details><summary>吉因加可参与的研究环节（不参与热点排序）</summary><p>${esc(t.participation)}</p><p class="meta">沿用已有公司能力范围；具体样本、平台、当前可交付产品/试剂盒待技术确认。</p></details></section>`}
function experts(){const chosen=D.people.filter(p=>(p.leader_weight||p.is_plenary)&&p.reports.some(c=>R[c].kind==='大会报告'||R[c].scope==='入榜'));V.innerHTML=`<section class="panel"><h2>从学术带头人，看会议研究动向</h2><p>连接学会、学科或研究领导角色与本届真实讲题。全国/领域和区域/专科角色分别展示；大会主讲人即使简介不足，也保留原题。</p><p class="meta">角色来源：CDS官方会议信息，含历任；尚未独立交叉核验任期。不是客户评级，也不是PI科研实力的完整排名。</p><div class="toolbar"><label class="search">姓名、单位或讲题<input id="expert-q" type="search" value="${esc(state.expertQ)}" placeholder="例如：纪立农、β细胞、上海"></label><label>角色范围<select id="expert-level"><option value="all">全部带头角色及大会主讲</option><option value="3">全国/领域学术引领</option><option value="2">区域/专科学术带头</option><option value="plenary">大会主讲人</option></select></label><label>研究主题<select id="expert-parent"><option value="all">全部研究主题</option>${D.parents.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label></div><div id="expert-list"></div><button id="expert-more" class="btn read-more">展开更多专家</button></section>`;document.querySelector('#expert-level').value=state.expertLevel;document.querySelector('#expert-parent').value=state.expertParent;
 const update=()=>{let ps=chosen.filter(p=>(state.expertLevel==='all'||state.expertLevel==='plenary'&&p.is_plenary||String(p.leader_weight)===state.expertLevel)&&(state.expertParent==='all'||p.topic_ids.some(id=>T[id].parent_id===state.expertParent))&&norm([p.name,p.institution,...p.reports.map(c=>R[c].title)].join(' ')).includes(norm(state.expertQ)));ps.sort((a,b)=>Number(b.is_plenary)-Number(a.is_plenary)||(b.leader_weight||0)-(a.leader_weight||0)||a.id.localeCompare(b.id));document.querySelector('#expert-list').innerHTML=`<p class="meta">${ps.length}位匹配；按大会主讲、角色范围和日程顺序展示，顺序不是个人实力评分。</p><div class="grid">${ps.slice(0,state.expertLimit).map(p=>speakerCard(p)).join('')}</div>`;document.querySelector('#expert-more').hidden=ps.length<=state.expertLimit;};document.querySelector('#expert-q').oninput=e=>{state.expertQ=e.target.value;state.expertLimit=18;update()};document.querySelector('#expert-level').onchange=e=>{state.expertLevel=e.target.value;state.expertLimit=18;update()};document.querySelector('#expert-parent').onchange=e=>{state.expertParent=e.target.value;state.expertLimit=18;update()};document.querySelector('#expert-more').onclick=()=>{state.expertLimit+=24;update()};update();}
function expert(id){const p=P[id];if(!p)return missing();V.innerHTML=`<div class="back"><a class="btn" href="#experts">← 返回专家动向</a></div><section class="panel"><h1>${esc(p.name)}</h1><p>${esc(p.institution)}</p><span class="pill ${p.leader_weight?'':'pending'}">${esc(p.leader_level||(p.is_plenary?'大会主讲 · 身份资料待补':'报告人 · 带头角色待核'))}</span><h3 style="margin-top:18px">角色依据</h3>${p.leader_basis.length?list(p.leader_basis):'<p>现有资料尚不足以按本榜规则认定带头角色，保留全部原始讲题。</p>'}<p class="meta">${esc(p.source_note)}。${esc(p.same_name_note||'')}</p><div class="links">${ext(p.profile_url,'官方讲者资料')}</div><p class="meta">简介状态：${esc(p.profile_status)}；${p.profile_has_bio?'有实质简介内容':'实质简介内容待补'}。</p></section><section class="panel"><h2>本届在讨论什么</h2><div class="chips">${p.topic_ids.map(id=>`<a class="chip" href="#topic/${id}">${esc(T[id].name)}</a>`).join('')}</div><p class="meta">共${p.reports.length}条日程报告；单列报告仍保留，是否计分逐条标明。</p>${p.reports.map(c=>report(R[c])).join('')}</section>`}
function sources(){const m=D.meta,s=m.scope;V.innerHTML=`<section class="panel"><h2>一张榜，回答三个问题</h2><p><b>讨论什么 → 谁在讲 → 为什么排在这里。</b> 排序基于会议安排与有来源的学术角色，成果内容待会后补充。</p><div class="scroll"><table><thead><tr><th>指标</th><th>权重</th><th>原始量怎么得到</th></tr></thead><tbody><tr><td>相关报告量</td><td>40</td><td>逐报告编号去重；一个报告只归一个主议题。</td></tr><tr><td>学术带头人覆盖</td><td>30</td><td>有官方简介依据的全国/领域角色每人3单位，区域/专科角色每人2单位；同人同题只计一次。没有依据者保留待核。</td></tr><tr><td>跨专题覆盖</td><td>20</td><td>按官方session_id统计涉及的不同专题。</td></tr><tr><td>大会及专题重点报告</td><td>10</td><td>3×大会报告＋1×专题报告；主持、致辞、企业专题会不计。</td></tr></tbody></table></div><p class="soft">${esc(m.normalization)}</p><p class="meta">以上权重、角色单位与议题边界均为AI试行设定，待mentor校准。报告量与重点报告等有相关性；小分差不代表实质优劣。</p><h3>更直观地读分数</h3><p>条形图越长，表示在本届当前分组中获得更多会议关注；100分不是临床成熟或研究质量满分。首页可切换“仅日程安排”，去掉专家30分后，剩余70分换算100分，观察名次变化。</p></section><section class="panel"><h2>学术角色如何认定</h2><p>依据官方会议简介中的全国性学会引领任职、国家级研究首席、相关学科/研究中心领导角色等提取，并逐句复核。记录具体职务和来源，不按客户A/B/C/D、医院名气或报告次数认定。</p><p>全国/领域3单位与区域/专科2单位用于覆盖计数，<b>不是两档个人学术水平评级</b>。同一人跨议题可出现，同议题去重；同名不同单位先分开保存。</p><p class="meta">官方简介可能含历任或缺少任期；这里展示的是“有来源的角色线索”。未提取到角色、链接暂时失败、只提供单位的简介，都不解释为没有学术影响。OR-only作者未做全量个人履历调查。</p><div class="stats"><div class="stat"><b>${s.profiles_read}/${s.profiles_requested}</b><span>原日程所附官方页读取成功</span></div><div class="stat"><b>${s.profiles_with_bio}</b><span>其中有实质简介内容</span></div><div class="stat"><b>${s.ranked_leaders}</b><span>入榜关联角色讲者</span></div><div class="stat"><b>${s.all_speakers}</b><span>全部学术报告去重讲者</span></div></div><details><summary>原日程所附资料读取范围</summary><p>优先处理全部大会/专题主讲，以及之前已有官方简介的14位报告人。共${s.profiles_requested}个入口、成功${s.profiles_read}个；其余入口和单位-only页面均留缺口。未扩展会议或论文结果。</p><p class="meta">所有原始页面、提取正文、角色依据与逐报告归类保存在本地工作资料目录。上方总人数与各题人数不同，因同一人可跨题，且培训/综合报告不计具体题关注度。</p></details></section><section class="panel"><h2>606条报告如何处理</h2><div class="scroll"><table><thead><tr><th>范围</th><th>条数</th><th>处理方式</th></tr></thead><tbody><tr><td>入榜报告</td><td>${s.ranked_reports}</td><td>${s.topic_count}个具体议题、${s.parent_count}个研究主题；全部有逐条归属。</td></tr>${Object.entries(s.excluded_counts).map(([k,n])=>`<tr><td>${esc(k)}</td><td>${n}</td><td>保留原题、讲者和来源，单列不计热点分。</td></tr>`).join('')}<tr><td>已处理学术格式报告</td><td>${s.all_academic}</td><td>大会11、专题259、论文发言336。</td></tr></tbody></table></div><p class="meta">原日程共${s.total_source_rows}行，另含主持、致辞、企业专题会等；不混入学术报告排行。主议题按对象/问题明确归属，跨题技术或药物标签不重复加分。</p><details><summary>单列的${s.all_academic-s.ranked_reports}条报告：没有遗漏，也未强行加分</summary>${D.reports.filter(r=>r.scope!=='入榜').map(report).join('')}</details></section><section class="panel"><h2>原始来源与可复算资料</h2><div class="links">${ext('https://cds26.tiemeeting.com/CN/Program/Details','CDS官方完整日程')}<a href="../原始材料/CDS_详细日程_2026-11-16.html" target="_blank">已有完整日程快照 ↗</a><a href="会前重点议题数据.json" download>下载完整榜单数据</a><a href="会前重点议题榜_工作资料/会前重点议题榜.csv" download>下载排名CSV</a><a href="会前重点议题榜_工作资料/逐报告归类与计分.json" download>606条归类台账</a><a href="会前重点议题榜_工作资料/学术带头人依据.json" download>学术角色依据</a></div><details><summary>来源指纹和本机存档</summary>${m.source_files.map(f=>`<article class="report"><b>${esc(f.path.split('/').pop())}</b><div class="source-path">${esc(f.path)}<br>SHA256 ${esc(f.sha256)}</div></article>`).join('')}</details><details><summary>范围与判断边界</summary>${list(m.notes)}</details><p class="meta">${esc(m.protected)}</p></section>`}
function missing(){V.innerHTML='<section class="panel"><h2>未找到该页面</h2><a href="#board">返回会前议题榜 →</a></section>'}
function render(){let route=location.hash.slice(1)||'board';const legacy={Q01:'H17',Q02:'H01',Q03:'H04',Q04:'H18',Q05:'H19',Q06:'H20',Q07:'H30',Q08:'H27',Q09:'H01',Q10:'H01'};if(route==='pi'||route.startsWith('pi/'))route='experts';if(route==='method')route='sources';if(route.startsWith('topic/Q'))route='topic/'+(legacy[route.split('/')[1]]||'');const active=route.startsWith('expert/')?'experts':route.startsWith('topic/')?'board':route;document.querySelectorAll('[data-view]').forEach(b=>{let yes=b.dataset.view===active;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',yes)});if(route==='board')board();else if(route==='experts')experts();else if(route==='sources')sources();else if(route.startsWith('topic/'))topic(route.split('/')[1]);else if(route.startsWith('expert/'))expert(route.split('/')[1]);else missing()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(location.hash.slice(1)===b.dataset.view){render();window.scrollTo(0,0)}else location.hash=b.dataset.view});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});render();
</script></body></html>
