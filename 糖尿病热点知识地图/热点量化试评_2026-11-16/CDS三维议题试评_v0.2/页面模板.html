<style>
:root{--navy:#142b49;--blue:#24578e;--ink:#172b4d;--muted:#657b95;--line:#d7e1ed;--soft:#edf3fb;--bg:#f2f5f9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.8 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:var(--navy);color:white;padding:24px max(20px,calc((100vw - 1200px)/2))}header small{color:#c6d7ed}h1{font-size:26px;margin:5px 0;line-height:1.5}h2{font-size:18px;line-height:1.6;margin:0 0 12px}h3{font-size:16px;line-height:1.6;margin:18px 0 8px}p{margin:8px 0}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}header a{color:#d3e4fb}button,input,select{font:inherit}button,a.btn{cursor:pointer;border:1px solid var(--line);background:white;color:var(--blue);padding:7px 15px;border-radius:5px;display:inline-block;text-align:center}button.active{color:white;background:var(--blue);border-color:var(--blue)}button:hover{filter:brightness(.97)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #91b9ed;outline-offset:3px}main{max-width:1240px;padding:24px 20px;margin:auto;min-width:0}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.panel{background:white;border:1px solid var(--line);border-radius:8px;padding:22px;margin-bottom:20px}.meta{font-size:13px;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0}.stat{background:var(--soft);padding:13px;border-radius:5px}.stat b{font-size:23px;display:block}.stat span{font-size:13px;color:var(--muted)}.notice{background:#fff6e8;border-left:3px solid #c4964d;padding:12px 16px;color:#775b31;margin:12px 0}.soft{background:var(--soft);padding:12px 15px;border-radius:5px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:15px}.toolbar label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted)}input,select{padding:8px 11px;background:#fff;border:1px solid var(--line);border-radius:4px;color:var(--ink);max-width:100%}.search{flex:1;min-width:180px}.scroll{overflow-x:auto;margin:12px 0}table{border-collapse:collapse;width:100%;min-width:850px;font-size:14px}th,td{padding:13px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f7f9fc;color:var(--muted);font-size:13px}td.topic{min-width:260px}td.dim{min-width:165px}.score{color:var(--blue);font-size:19px;font-weight:700}.bar{background:#e5eef9;width:85px;height:5px;border-radius:3px;margin-top:4px}.bar i{display:block;background:#487eb6;height:100%;border-radius:3px}.pill{display:inline-block;background:var(--soft);color:var(--blue);font-size:13px;padding:1px 7px;border-radius:3px;margin:3px 4px 3px 0}.pill.pending{background:#f5eee3;color:#88663a}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.grid .panel{margin-bottom:0}.grid>*,article{min-width:0}.links{display:flex;gap:15px;flex-wrap:wrap;margin-top:13px}.subtitle{font-size:13px;color:var(--muted);margin:5px 0}.report{border-top:1px solid var(--line);padding:13px 0;overflow-wrap:anywhere}.report:first-child{border-top:0}.report-title{font-weight:600;color:var(--ink)}details{border-top:1px solid var(--line);padding:13px 0}summary{cursor:pointer;color:var(--blue);font-weight:600}ul,ol{padding-left:22px}li{margin:5px 0;overflow-wrap:anywhere}.back{margin-bottom:16px}.stack{display:grid;gap:16px}.empty{padding:28px;text-align:center;background:var(--soft)}.fields{display:flex;gap:20px;flex-wrap:wrap}.download{font-size:13px}.metric-rule{overflow-wrap:anywhere}.footer{padding:20px;text-align:center;color:var(--muted);font-size:13px}.small-table table{min-width:620px}.reference{overflow-wrap:anywhere}.align{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}footer a{color:var(--blue)}@media(max-width:850px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){header{padding:20px 16px}h1{font-size:23px}main{padding:16px 12px}.panel{padding:17px}.toolbar label{width:100%}.stat b{font-size:22px}.nav button{flex:1;padding:7px 9px}.score{font-size:18px}}
 .pill.B{background:#e5effd;color:#20589a}.pill.C{background:#fff3d9;color:#79561e}.pill.D{background:#eef0f3;color:#596574}.score-note{font-size:14px;color:var(--muted)}.person-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.person-grid>article{min-width:0}.papers{overflow-wrap:anywhere}.rated-table td{min-width:100px}.op-summary{margin:16px 0}.source-list{font-size:13px}.person-focus{outline:2px solid #376da6;outline-offset:4px}.paper-meta{font-size:13px;color:var(--muted);margin:6px 0}@media(max-width:700px){.person-grid{grid-template-columns:1fr}} </style></head><body><header><small>临床科研热点工作台 · 糖尿病 · 本地待复核</small><h1>CDS具体议题三维试评</h1><div>2026.11.16 · v0.2 已补PI公开资料 · 研究关注度 × 客户机会 × 科研转化</div><div class="links"><a href="../重点议题榜_待复核.html">原CDS / ADA大类榜</a><a href="#method">本版评分口径与材料范围 →</a></div></header>
<main><nav class="nav" aria-label="试评模块"><button data-route="board">议题试评</button><button data-route="pi">PI评级与缺口</button><button data-route="method">口径与来源</button></nav><div id="view" aria-live="polite"></div></main><footer class="footer">已补14位报告人公开资料 · AI暂评待导师校准 · 本地试评页</footer>
<script id="data" type="application/json">__DATA__</script><script>
const D=JSON.parse(document.querySelector('#data').textContent), V=document.querySelector('#view');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const link=(url,label)=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)} ↗</a>`;
const list=xs=>`<ul>${xs.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
let state={category:'全部',search:'',sort:'attention',scenario:'默认'};
function go(route){if(location.hash.slice(1)===route)render();else location.hash=route}
function attention(t){return t.scenario_scores[state.scenario]}

const sourcesById=Object.fromEntries(D.pi_sources.map(s=>[s.id,s]));
const refs=ids=>`<div class="source-list">${ids.map(id=>{let s=sourcesById[id];return s?link(s.url,s.title):esc(id)}).join('；')}</div>`;
const badge=p=>p.grade?`<span class="pill ${p.grade}">客户${p.grade} · ${p.total_score}分（暂评）</span>`:`<span class="pill pending">已评分${p.scored_dimensions}/4项 · 总分待补</span>`;
const known=p=>p.total_score!==null?`${p.total_score}/100`:`已评分小计 ${p.known_subtotal}/${p.known_maximum}（未折算）`;
function customer(t){return `<div class="score">${t.customer_score!==null?t.customer_score.toFixed(2):t.customer_known_subtotal!==null?t.customer_known_subtotal.toFixed(2)+'*':'待补'}</div><div class="meta">${t.customer_score!==null?'议题完整加权分':t.customer_known_subtotal!==null?'*仅已评级贡献小计':'暂不计分'} · 覆盖 ${t.rated_speakers}/${t.n_speakers}</div>${t.customer_missing_names.length?`<div class="meta">待补：${esc(t.customer_missing_names.join('、'))}</div>`:''}`}
function tableRows(ts){return ts.map(t=>`<tr><td>${t.scenario_ranks[state.scenario]}</td><td class="topic"><a href="#topic/${t.id}"><b>${esc(t.name)}</b></a><div class="subtitle">${t.id} · ${esc(t.category)}</div><span class="pill">${t.n_reports}条报告</span><span class="pill">${t.n_institutions}个报告机构</span></td><td class="dim"><div class="score">${attention(t).toFixed(1)}</div><div class="bar"><i style="width:${attention(t)}%"></i></div><div class="meta">本轮样本相对分<br>权重情景名次 ${Math.min(...Object.values(t.scenario_ranks))}—${Math.max(...Object.values(t.scenario_ranks))}</div></td><td class="dim">${customer(t)}<a href="#topic/${t.id}">查看人员与依据 →</a></td><td class="dim"><b>${esc(t.opportunity)}</b><div>${esc(t.action)}</div><div class="meta">${esc(t.stage)}</div></td></tr>`).join('')}
function board(){const r=D.meta.pi_review;const covered=D.topics.filter(t=>t.customer_score!==null).sort((a,b)=>b.customer_score-a.customer_score);
 V.innerHTML=`<section class="panel"><h2>具体研究问题，关联到可沟通的客户</h2><p>从606条学术格式日程中选择14条，围绕10个具体问题试评。本轮联网补14位报告人资料，逐篇核对35篇代表作；研究关注度与临床成熟度口径保留。</p><div class="stats"><div class="stat"><b>10</b><span>具体候选议题</span></div><div class="stat"><b>14</b><span>已补公开资料的报告人</span></div><div class="stat"><b>${r.complete} / 14</b><span>四维暂评完成</span></div><div class="stat"><b>${r.partial}</b><span>有部分评分、仍缺证据</span></div></div><div class="notice">CDS 2026本届尚未举行，议题依据仍为计划题名。个人评分基于公开证据，尚非导师确认；研究关注、客户机会、科研转化分别展示。</div></section>
 <section class="panel"><div class="align"><h2>客户机会：目前能看出什么</h2><a href="#pi">查看14人评级与缺口 →</a></div><p>已完整覆盖的${covered.length}个议题，可先比较客户加权分；其余${D.topics.length-covered.length}个仍受资料缺口影响。分数是人员贡献累计，不是百分制，也没有“强/弱”阈值。</p><div class="grid">${covered.map(t=>`<article class="soft"><a href="#topic/${t.id}"><b>${esc(t.name)}</b></a><p class="score">${t.customer_score.toFixed(2)}</p><p class="meta">完整覆盖 ${t.rated_speakers}/${t.n_speakers} · ${Object.entries(t.customer_grade_counts).filter(([g,n])=>n).map(([g,n])=>g+'级'+n+'人').join('、')}</p></article>`).join('')}</div><p><b>重点补证：</b>肖新华、匡洪宇已有全国学术任职依据，程棣有队列/临床研究执行经历；本人基金主持证据尚缺，暂不加入完整客户分。<a href="#pi">查看具体缺口</a></p><p class="meta">本轮完整暂评：B ${r.grade_counts.B}人、C ${r.grade_counts.C}人、D ${r.grade_counts.D}人；A ${r.grade_counts.A}人仅指已评级${r.complete}人，不能解释为14人中没有A级。</p></section>
 <section class="panel"><div class="align"><h2>具体议题试评表</h2><a href="#method">查看算法与联网来源 →</a></div><div class="toolbar"><label>研究用途<select id="category">${['全部','早期识别','分型与预测','动态监测','其他研究'].map(c=>`<option ${state.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="search">检索议题、报告人或题名<input id="search" type="search" value="${esc(state.search)}" placeholder="例如：肾小管、Ppp1r3g、沈洁"></label><label>展示顺序<select id="sort"><option value="attention" ${state.sort==='attention'?'selected':''}>研究关注度</option><option value="review" ${state.sort==='review'?'selected':''}>首轮补证建议</option></select></label><label>关注度权重<select id="scenario">${Object.keys(D.meta.method.variants).map(s=>`<option ${state.scenario===s?'selected':''}>${s}</option>`).join('')}</select></label></div><div id="rows"></div><p class="meta">客户加权：A3/B2/C1 × 个人总分/100，D贡献0并保留名单；未评级保持缺失。带*小计不能与完整分直接排强弱。研究关注度排序独立于客户分。</p></section>`;
 const update=()=>{let ts=D.topics.filter(t=>(state.category==='全部'||t.category===state.category)&&JSON.stringify([t.name,t.question,t.reports]).replace(/\s+/g,'').toLowerCase().includes(state.search.replace(/\s+/g,'').toLowerCase()));ts.sort(state.sort==='review'?(a,b)=>a.priority-b.priority:(a,b)=>attention(b)-attention(a)||a.id.localeCompare(b.id));document.querySelector('#rows').innerHTML=ts.length?`<div class="meta">${ts.length}个议题 · 关注度归一化固定使用完整10题样本</div><div class="scroll"><table><thead><tr><th>关注序位</th><th>具体议题</th><th>研究关注度 / 100</th><th>客户机会加权分与覆盖</th><th>科研转化机会初判</th></tr></thead><tbody>${tableRows(ts)}</tbody></table></div>`:`<div class="empty">${state.category==='动态监测'?'本轮尚未选入可直接试评的动态监测议题。':'没有匹配的议题，请调整筛选。'}</div>`};
 document.querySelector('#category').onchange=e=>{state.category=e.target.value;update()};document.querySelector('#search').oninput=e=>{state.search=e.target.value;update()};document.querySelector('#sort').onchange=e=>{state.sort=e.target.value;update()};document.querySelector('#scenario').onchange=e=>{state.scenario=e.target.value;update()};update();
}
function report(r,background=false){return `<article class="report"><div><span class="pill">${esc(r.code)}</span><span class="pill">${esc(r.kind)}</span>${background?'<span class="pill pending">背景，不计分</span>':''}</div><div class="report-title">${esc(r.title)}</div><div>${r.people.map(p=>esc(p.name)+' · '+esc(p.institution)).join('；')}</div><div class="meta">${esc(r.date)} · ${esc(r.session)} · ${esc(r.time)}</div><div class="links">${link(r.source_url,'官方日程来源')}<a href="../原始材料/CDS_详细日程_2026-11-16.html#${esc(r.session_id)}" target="_blank">本地原始快照 ↗</a></div><div class="meta">读取层次：计划题名，未读本届结果；报告人不自动等于课题PI。</div></article>`}
function topic(id){const t=D.topics.find(x=>x.id===id);if(!t)return missing();const people=D.people.filter(p=>t.people_ids.includes(p.id));V.innerHTML=`<div class="back"><a class="btn" href="#board">← 返回议题试评</a></div><section class="panel"><span class="pill">${t.id}</span><span class="pill">${esc(t.category)}</span><h1>${esc(t.name)}</h1><p><b>临床研究问题：</b>${esc(t.question)}</p><p class="meta">原大类：${esc(t.parent)}。${esc(t.grouping)}</p></section><div class="grid"><section class="panel"><h2>① 研究关注度</h2><div class="score">${t.attention_score.toFixed(1)} / 100</div><p>${t.n_reports}条报告 · ${t.n_institutions}个报告机构 · ${t.n_sessions}个专题</p><p class="meta">${esc(t.attention_basis)}。详情显示默认权重；不同编号未核为独立研究。</p>${list(t.attention_components.map(c=>`${c.name}：原始量${c.raw} / 本轮最大${c.sample_max} → ${c.score.toFixed(2)} / ${c.weight}分`))}<p class="meta">关键报告量=3×大会+2×专题。机构覆盖不等于独立团队验证。</p></section><section class="panel"><h2>② 客户机会强度</h2>${customer(t)}<p class="meta">${esc(t.customer_status)}。A/B/C/D人数：${Object.entries(t.customer_grade_counts).map(([g,n])=>g+' '+n).join(' / ')}（仅已评级人员）；A级密度${t.customer_a_density===null?'待全员评级':(100*t.customer_a_density).toFixed(0)+'%'}。</p>${people.map(p=>`<article class="report"><a href="#pi/${p.id}"><b>${esc(p.name)}</b> →</a> ${badge(p)}<div class="meta">${esc(known(p))}</div><p>${esc(p.contact_action)}</p></article>`).join('')}<p class="meta">若有未评级人员，本议题完整分保留缺失；不能把客户公开资料评分当实际采购意向。</p></section><section class="panel"><h2>③ 科研转化机会</h2><span class="pill">${esc(t.opportunity)}</span><p><b>${esc(t.action)}</b></p><p>${esc(t.reason)}</p><p class="meta">${esc(t.maturity)}</p><div class="soft">成熟度：${esc(t.clinical_evidence_status)}</div><p class="meta">临床问题清晰及题名中的队列/验证线索支持优先补证；没有结果时不生成成熟度分或“可进入临床”结论。</p></section></div><section class="panel" style="margin-top:20px"><h2>吉因加可以参与哪一环</h2><p>${esc(t.participation)}</p><p><b>技术匹配初判：</b>${esc(t.fit)}</p><div class="small-table scroll"><table><thead><tr><th>能力ID</th><th>公司能力</th><th>已存确认范围（2026-11-10）</th></tr></thead><tbody>${t.capabilities.map(c=>`<tr><td>${c.id}</td><td>${esc(c.name)}</td><td>${esc(c.status)}</td></tr>`).join('')}</tbody></table></div><div class="notice">${esc(t.capability_gap)}</div><p class="meta">具体产品/试剂盒未匹配：现有材料不足以指定一个已验证、当前可交付的糖尿病检测产品。技术类别与产品用途分别确认。</p></section><section class="panel"><h2>判断线索与待补证据</h2><div class="grid"><article><h3>题名中能确认的线索</h3>${list(t.cues)}</article><article><h3>原始研究缺口</h3>${list(t.next_evidence)}</article><article><h3>客户证据缺口</h3>${list(people.map(p=>p.name+'：'+p.gaps.join('；')))}</article></div></section><section class="panel"><h2>直接关联报告 · ${t.reports.length}条</h2>${t.reports.map(r=>report(r)).join('')}<details><summary>背景报告 · ${t.context_reports.length}条（不计关注度）</summary>${t.context_reports.map(r=>report(r,true)).join('')}</details></section>`}

function dateText(a){return a.dates.map((d,i)=>`${i===0?'正式卷期':'Epub'}：${[d.Year,d.Month,d.Day].filter(Boolean).join('-')||d.MedlineDate||'未标'}`).join('；')}
function paperCard(a){return `<article class="report papers"><b>${link(a.url,a.title)}</b><div class="paper-meta">${esc(a.journal)} · ${esc(dateText(a))}<br>列名顺序 ${esc(a.author_position)} · ${esc(a.author_role)} · PMID ${a.pmid}${a.doi?' · DOI '+esc(a.doi):''}</div><p class="meta">本人作者机构：${esc(a.matched_author.affiliations.join('；'))}</p><div>${a.if_value!==null?`期刊IF ${a.if_value}（${esc(a.if_year)}） ${refs([a.if_source_id])}`:`<span class="pill pending">最新IF未核，不据此提高档位</span>`}</div></article>`}
function personDetail(p){return `<details id="${p.id}"><summary>${esc(p.name)} · ${esc(p.institution)} ${badge(p)}</summary><p><b>${esc(p.role_status)}</b></p><p>学术角色判断：${esc(p.head_pi_status)}。</p><p class="meta">${esc(p.identity_note)} ${esc(p.evidence_status)}。</p><div class="links">${p.topics.map(id=>`<a href="#topic/${id}">${id}议题 →</a>`).join('')}${link(p.profile_url,'已读取的官方讲者简介')}</div><div class="small-table scroll"><table><thead><tr><th>维度</th><th>分数 / 满分</th><th>评分依据及来源</th></tr></thead><tbody>${p.dimensions.map(c=>`<tr><td>${esc(c.name)}</td><td>${c.score===null?'待补':c.score} / ${c.maximum}</td><td>${esc(c.basis)}${refs(c.source_ids)}<div class="meta">${esc(c.status)}</div></td></tr>`).join('')}</tbody></table></div><p><b>${p.total_score===null?esc(known(p))+'；总分和等级待补。':'综合 '+p.total_score+'/100 · 客户'+p.grade+'（AI暂评）'}</b></p><div class="person-grid"><article><h3>仍缺哪些证据</h3>${list(p.gaps)}<h3>吉因加可沟通的环节</h3><p>${esc(p.contact_action)}</p></article><article><h3>已核基金/项目角色</h3>${p.grants.length?p.grants.map(g=>`<div class="report"><b>${esc(g.level)}</b><p>${esc(g.name)}</p><p>${esc(g.role)}${g.number?' · '+esc(g.number):' · 准确项目号待补'}</p><p class="meta">${esc(g.status)}</p>${refs(g.source_ids)}</div>`).join(''):'<p>未获得足以确认本人主持项目的原始记录；不将“参与”、论文致谢或同名者基金改记为本人主持。</p>'}</article></div><details><summary>代表性论文 · ${p.papers.length}篇（PubMed逐篇核实）</summary>${p.papers.length?p.papers.map(paperCard).join(''):'<p>本轮未唯一定位到本人机构匹配的PubMed论文。仍需英文署名与本人清单，不等于无SCI。</p>'}</details><p class="meta">本届日程关联：${p.evidence.map(e=>link(e.source_url,e.code+' '+e.title)).join('；')}</p></details>`}
function pi(focus){const r=D.meta.pi_review;V.innerHTML=`<section class="panel"><h2>14位报告人：四维评级与证据缺口</h2><p>契合度30＋学术产出25＋科研转化25＋平台20；A≥90、B75—89、C60—74、D＜60。公开资料可支持${r.complete}人完整暂评；${r.partial}人已有分项评分，缺项保留待补。</p><div class="notice">完整暂评 ${r.complete}/14：B ${r.grade_counts.B}、C ${r.grade_counts.C}、D ${r.grade_counts.D}；其余${r.partial}人尚不能定级。研究生、住院医师与课题负责人分别识别；分数不等于头部身份或真实采购意愿。</div><p class="meta">近三年：${esc(r.window)} 原Skill允许合作论文触发期刊档位，作者位置另列；不将59/93位作者当论文牵头者。基金档依据及NSFC原始记录缺口逐人标明。</p><div class="scroll"><table class="rated-table"><thead><tr><th>报告人</th><th>契合 /30</th><th>产出 /25</th><th>转化 /25</th><th>平台 /20</th><th>总分与状态</th></tr></thead><tbody>${D.people.map(p=>`<tr><td><a href="#pi/${p.id}">${esc(p.name)} →</a></td>${p.dimensions.map(d=>`<td>${d.score===null?'待补':d.score}</td>`).join('')}<td>${badge(p)}<div class="meta">${esc(known(p))}</div></td></tr>`).join('')}</tbody></table></div></section><section class="panel"><h2>展开查看本人证据、缺口与合作入口</h2>${D.people.map(personDetail).join('')}</section>`;if(focus){const el=document.getElementById(focus);if(el){el.open=true;el.classList.add('person-focus');el.scrollIntoView({block:'start'})}}}
function method(){const m=D.meta,s=m.source_scope,r=m.pi_review;V.innerHTML=`<section class="panel"><h2>本轮更新与数据范围</h2><p>新增14人公开资料补证、${r.selected_pubmed_papers}篇代表作PubMed核对、基金与平台来源。${r.complete}人完成四维AI暂评、${r.partial}人部分评分。仅更新本地CDS试评页。</p><p>${s.total_sessions}个专题容器、${s.academic_reports}条学术报告；本轮选择${s.selected_reports}条、${s.selected_topics}个问题。CDS本届报告结果仍未读取，研究关注度和科研成熟度判断保留。</p><div class="notice">来源已读取不等于资料齐全。官方简介可支持保守暂评，但国自然原始负责人记录、队列使用权和实际需求仍需逐人核实；不因资料缺失填0。</div></section>
<section class="panel"><h2>① PI四维评分（clinical-research-v3 V3.2）</h2><div class="small-table scroll"><table><thead><tr><th>维度</th><th>原Skill档位</th><th>本轮用法</th></tr></thead><tbody><tr><td>契合度 /30</td><td>25—30高度契合；18—24相关可拓展；10—17部分相关；0—9不相关</td><td>病种例子改为糖尿病，结合公司已有技术类别与实际研究；不因“糖尿病”三个字满分。</td></tr><tr><td>产出 /25</td><td>20—25：近三年IF&gt;15或累计&gt;40；14—19：IF&gt;8或累计&gt;20；8—13：SCI IF3—8；0—7：已确认无SCI</td><td>逐篇核对全名、本人机构和排位，使用已核期刊指标；未核IF不计，未找到论文不计“无SCI”。合作作者按原规则入档，头部结论另判。</td></tr><tr><td>转化 /25</td><td>20—25：主持国自然≥2或重点研发骨干＋多中心RCT牵头；14—19：国自然1＋队列；8—13：省自然/院级＋小队列；0—7：已确认无独立基金</td><td>项目角色必须归本人。省级教育科研在8—13档作同层级参照，待导师校准。宋金方、沈洁按官方本人简介保守入档，NSFC原始项目详情仍列待补；不以全科基金凑本人项数。</td></tr><tr><td>平台 /20</td><td>16—20：顶级三甲且科室全国TOP5；11—15：三甲且科室区域知名；6—10：三甲；0—5：非三甲</td><td>核对甲/乙等、机构更名和科室层级。没有原始TOP5依据者不入最高档；平台存在不等于本人可自由调用。</td></tr></tbody></table></div><p>${esc(r.score_policy)}</p><p class="meta">档内具体分是AI保守试评，原Skill没有进一步逐分公式；现阶段不宜解释1—2分差异。代表作不是完整履历审计，未核全量IF可能低估产出档位。</p><p>${esc(r.author_policy)}</p><p>${esc(r.grant_policy)}</p></section>
<section class="panel"><h2>② 客户机会如何算</h2><p>${esc(m.rating_rule.customer_aggregation)}</p><p>例：Q07沈洁B级79分，贡献2×0.79=1.58；杨敏D级52分贡献0并保留名单，覆盖2/2，完整分1.58。Q04陈铎C级63分贡献0.63，余超伦尚缺基金证据，只显示0.63*小计，不能与完整议题分直接排强弱。</p><p>A级密度=完整评级后A级人数÷议题全部关联人数；不完整时只报已评级A级人数。D贡献0来自本轮既定聚合规则，不等于D级研究没有合作价值。${esc(m.rating_rule.head_pi)}</p></section>
<section class="panel"><h2>③ 研究关注度与科研转化</h2><p>${esc(m.method.normalization)}</p><p>${Object.entries(m.method.weights).map(([k,w])=>`${esc(k)} ${w}`).join(' · ')}；保留默认、等权、偏报告量三个情景。</p>${list(m.method.assumptions)}<p>科研转化标签仍是日程题名初判：优先补证、机制到验证、先核临床增量/指标组成。PI既往论文仅用于客户画像；没有自动当作本届CDS结果，也没有重评Biomarker临床成熟度。</p></section>
<section class="panel"><h2>联网证据与核查记录</h2><p>${esc(r.window)}</p>${list(r.search_limits)}<details><summary>身份排除与容易混淆的证据</summary>${list(r.excluded_identity_cases.map(e=>e.person+'：'+e.reason))}</details><details><summary>官方简介、基金、平台、期刊指标及PubMed链接 · ${D.pi_sources.length}条来源记录</summary>${D.pi_sources.map(x=>`<article class="report"><b>${link(x.url,x.title)}</b><div class="meta">${esc(x.reading_note)}</div></article>`).join('')}</details><div class="links"><a href="PI联网评级.json" download>下载评级与来源</a><a href="PI评级与缺口.json" download>下载14人评级记录</a><a href="PI待评级.json" download>下载9人剩余缺口</a><a href="PI评级规则快照.txt" download>原Skill规则快照</a><a href="联网补证_2026-11-16/PubMed检索日志.json" download>初轮检索日志</a><a href="联网补证_2026-11-16/PubMed补充检索日志.json" download>扩展检索日志</a></div></section>
<section class="panel"><h2>既有来源与复算</h2><div class="links">${link('https://cds26.tiemeeting.com/CN/Program/Details','CDS官方日程')}<a href="../原始材料/CDS_详细日程_2026-11-16.html">本地日程快照</a><a href="试评数据.json" download>完整数据</a><a href="材料覆盖.json" download>材料范围</a><a href="议题逐条归属.json" download>606条覆盖台账</a></div><details><summary>输入来源与指纹</summary>${m.input_files.map(f=>`<article class="report"><b>${esc(f.path.split('/').pop())}</b><div class="meta reference">${esc(f.path)}<br>SHA256 ${esc(f.sha256)}</div></article>`).join('')}</details><details><summary>已读本地资料</summary>${m.source_review.map(x=>`<article class="report">${esc(x.source)}<p>${esc(x.result)}</p></article>`).join('')}</details></section><section class="panel"><h2>下一步补证重点</h2>${list(m.next_review)}<p class="meta">本轮已授权补14人公开资料；正式网站、GitHub、ADA与旧榜单保留，未创建定时任务或热点量化Skill。</p></section>`}
function missing(){V.innerHTML='<section class="panel"><h2>未找到该议题</h2><a href="#board">返回议题试评 →</a></section>'}
function render(){let route=location.hash.slice(1)||'board';document.querySelectorAll('[data-route]').forEach(b=>{let on=b.dataset.route===(route.startsWith('topic/')?'board':route.startsWith('pi/')?'pi':route);b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});if(route==='board')board();else if(route==='pi'||route.startsWith('pi/'))pi(route.split('/')[1]);else if(route==='method')method();else if(route.startsWith('topic/'))topic(route.slice(6));else missing()}
document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>go(b.dataset.route));window.addEventListener('hashchange',()=>{render();if(!location.hash.startsWith('#pi/'))window.scrollTo(0,0)});render();
</script></body></html>
